[package]
name = "shagger"
description = "SHAGGER engine: networking, loaders, renderer, audio, input, UI."
# src/babylon/ holds code ported from Babylon.js under Apache-2.0; everything else is MIT.
license = "MIT AND Apache-2.0"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
shagger_shared.workspace = true
# The game server and lobby connections (RUST.md 4.1): WebSocket over rustls,
# trusting the Mozilla roots bundled by webpki-roots, on a tokio runtime that
# runs on the network thread.
# Lobby messages are JSON text frames (RUST.md 4.10).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite leaves the choice of rustls crypto provider to us; without
# one, the first wss:// connection panics. ring builds without a C toolchain
# beyond cc and is the provider RUST.md 4.1 names.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# Packages (RUST.md 20.8): zip with deflate only, in pure Rust.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Texture decoding (RUST.md 20.6): WebP, TGA, PNG and JPEG.
image = { version = "0.25", default-features = false, features = ["webp", "tga", "png", "jpeg"] }
# The renderer (RUST.md 8.2, 21). wgpu 30 is the release egui 0.37 builds on,
# so the HUD can share the device later (RUST.md 12 asks the versions agree).
wgpu = "30"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# KHR_draco_mesh_compression for the player model (RUST.md 20.7): a pure
# Rust port of Google's Draco decoder, Apache-2.0, decoding only.
draco-core = { version = "2.3", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
lewton = "0.10"
rtrb = "0.4"
cpal = "0.18"
rmp3 = { version = "0.3", features = ["std"] }
swash = "0.2"
# Menus, lobby, settings and the console (RUST.md 11): egui on the game's own
# wgpu device, fed winit's events. Without clipboard and links, which bring
# in arboard and webbrowser; the game window does without both for now.
egui = "0.37"
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Demo and package downloads over HTTP(S) (RUST.md 7), on rustls with ring
# like the websocket, which the downloader installs as the provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[lints]
workspace = true

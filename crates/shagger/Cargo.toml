[package]
name = "shagger"
description = "SHAGGER engine: networking, loaders, renderer, audio, input, UI."
# src/babylon/ holds code ported from Babylon.js under Apache-2.0; everything else is MIT.
license = "MIT AND Apache-2.0"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
shagger_shared.workspace = true
# The game server and lobby connections (RUST.md 4.1): WebSocket over rustls,
# trusting the Mozilla roots bundled by webpki-roots, on a tokio runtime that
# runs on the network thread.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[lints]
workspace = true
